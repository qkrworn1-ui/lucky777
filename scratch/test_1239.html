<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="../data.js"></script>
<script src="../app_v2.js?v=723"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        try {
            const v4 = window.computeAbsoluteTop10Combinations(false, 1239, 'v4', true, 'master');
            console.log('1239 v4 count:', v4 ? v4.length : 0);
            const v3 = window.computeAbsoluteTop10Combinations(false, 1239, 'v3', true, 'master');
            console.log('1239 v3 count:', v3 ? v3.length : 0);
            
            // Check winning against 1239 actual [1, 3, 17, 26, 33, 42] bonus 41
            const winSet = new Set([1, 3, 17, 26, 33, 42]);
            let hits = 0;
            [...(v4||[]), ...(v3||[])].forEach(c => {
                const nums = c.numbers;
                const m = nums.filter(n => winSet.has(n)).length;
                if (m >= 3) {
                    console.log('Hit: ' + m + ' numbers: ' + nums.join(','));
                    hits++;
                }
            });
            console.log('Total hits >= 3 in 1239: ' + hits);
        } catch (e) {
            console.error('ERROR:', e);
        }
    }, 500);
});
</script>
</body>
</html>
