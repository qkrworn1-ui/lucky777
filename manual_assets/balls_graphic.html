<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: #0f172a; width: 720px; height: 235px; padding: 12px; color: #fff; display: flex; flex-direction: column; gap: 8px; }
.ticker-box { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; border-radius: 8px; padding: 7px 12px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.ticker-badge { background: #10b981; color: #fff; font-weight: 800; font-size: 9.5px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.ticker-text { color: #ecfdf5; font-weight: 600; white-space: nowrap; overflow: hidden; }
.ball-row { background: #1e293b; border: 1px solid #334155; border-radius: 9px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
.algo-name { font-size: 11.5px; font-weight: 800; color: #38bdf8; width: 140px; }
.balls { display: flex; gap: 5px; }
.ball { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); box-shadow: inset -2px -2px 3px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2); }
.b-yellow { background: #eab308; }
.b-blue { background: #3b82f6; }
.b-red { background: #ef4444; }
.b-grey { background: #64748b; }
.b-green { background: #10b981; }
.score-badge { font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 5px; background: rgba(234,179,8,0.2); color: #facc15; border: 1px solid #eab308; }
</style>
</head>
<body>
<div class="ticker-box">
    <span class="ticker-badge">📢 직전회차 당첨 속보</span>
    <span class="ticker-text">🎉 [1238회] 강**님 5등 당첨 (5,000원) 👏 &nbsp;&nbsp;|&nbsp;&nbsp; 🎉 [1238회] 김**님 4등 당첨 (50,000원) 👏</span>
</div>
<div class="ball-row">
    <div class="algo-name">V4.0 행동경제학 A조</div>
    <div class="balls">
        <div class="ball b-yellow">07</div>
        <div class="ball b-blue">14</div>
        <div class="ball b-red">23</div>
        <div class="ball b-red">28</div>
        <div class="ball b-grey">35</div>
        <div class="ball b-green">42</div>
    </div>
    <div class="score-badge">4개 적중 (4등) 🎯</div>
</div>
<div class="ball-row">
    <div class="algo-name">V3.0 정통수학 B조</div>
    <div class="balls">
        <div class="ball b-yellow">03</div>
        <div class="ball b-yellow">08</div>
        <div class="ball b-blue">17</div>
        <div class="ball b-red">24</div>
        <div class="ball b-grey">39</div>
        <div class="ball b-green">45</div>
    </div>
    <div class="score-badge" style="background: rgba(16,185,129,0.2); color: #34d399; border-color: #10b981;">3개 적중 (5등) ✨</div>
</div>
</body>
</html>
