<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: #0f172a; width: 720px; height: 235px; padding: 12px; color: #fff; display: flex; gap: 10px; }
.card { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; }
.card-header { font-size: 12px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.qr-preview { background: #0f172a; border: 2px dashed #3b82f6; border-radius: 8px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
.qr-box { width: 46px; height: 46px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.sim-metric { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 5px; margin-bottom: 5px; font-size: 11px; }
.sim-val { font-weight: 800; color: #34d399; }
.sim-btn { background: #8b5cf6; color: #fff; border: none; border-radius: 5px; padding: 7px; font-size: 11px; font-weight: 700; text-align: center; margin-top: auto; }
</style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <span style="color: #60a5fa;">📷 복권 영수증 QR 1초 스캔</span>
        <span style="font-size: 9.5px; background: #2563eb; padding: 1px 5px; border-radius: 4px;">자동인식</span>
    </div>
    <div class="qr-preview">
        <div class="qr-box">📱</div>
        <div style="font-size: 11px; font-weight: 700; color: #93c5fd;">카메라로 QR코드를 비추세요</div>
        <div style="font-size: 9.5px; color: #94a3b8;">1초 만에 5게임 등록 + 50게임 무료 해제!</div>
    </div>
</div>
<div class="card">
    <div class="card-header">
        <span style="color: #c084fc;">🧪 과거 회차 모의 시뮬레이션</span>
        <span style="font-size: 9.5px; background: #7c3aed; padding: 1px 5px; border-radius: 4px;">ROI 검증</span>
    </div>
    <div class="sim-metric">
        <span>선택 알고리즘</span>
        <span style="font-weight: 700; color: #93c5fd;">V4.0 행동경제학</span>
    </div>
    <div class="sim-metric">
        <span>테스트 회차</span>
        <span style="font-weight: 700;">최근 10회차 (1229~1238회)</span>
    </div>
    <div class="sim-metric">
        <span>모의 당첨률 / 수익률</span>
        <span class="sim-val">5등 14회 / 4등 2회 (+185%)</span>
    </div>
    <div class="sim-btn">⚡ 시뮬레이션 모의 실행 완료</div>
</div>
</body>
</html>
